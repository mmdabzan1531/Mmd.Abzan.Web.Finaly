<!doctype html>
<html lang="en" dir="ltr" data-keep-dir><head>{% include "_head.html" %}<link rel="stylesheet" href="{{ url_for('static', filename='ui-pro.css') }}?v={{ ASSET_V }}"><title>Language | Chatroom</title></head>
<body class="auth-body" data-no-i18n>
{% include "_star.html" %}
<div class="ig">
<main class="ig-main" aria-labelledby="lang-title">
  <section class="ig-card">
    <div class="ig-brand"><svg class="mark"><use href="#star"/></svg><h1>Chatroom</h1></div>
    <h2 style="text-align:center;margin:6px 0 4px" id="lang-title">Choose your language</h2>
    <p class="ig-sub" style="text-align:center" dir="rtl">زبان خود را انتخاب کنید</p>
    <nav class="lang-grid" aria-label="Language / زبان">
      {% for code, name in LANGS %}
      <a class="ig-btn lang-btn{{ ' on' if code == current else '' }}" href="{{ url_for('set_lang', code=code, next=nxt) }}" lang="{{ code }}" hreflang="{{ code }}" dir="{{ 'rtl' if code in ('fa', 'ar', 'ur', 'he') else 'ltr' }}"{% if code == current %} aria-current="true"{% endif %}>{{ name }}</a>
      {% endfor %}
    </nav>
  </section>
</main>
</div>
<style>
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.lang-btn{display:block;text-align:center;text-decoration:none;padding:14px 8px;box-sizing:border-box}
.lang-btn.on{outline:2px solid currentColor;outline-offset:2px}
.lang-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.lang-btn{transition:transform .12s}.lang-btn:active{transform:scale(.97)}
@media (max-width:300px){.lang-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.lang-btn{transition:none}}
</style>
</body></html>
