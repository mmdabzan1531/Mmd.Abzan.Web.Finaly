<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>ورود به Insta Mode</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#5931a6 0,transparent 38%),radial-gradient(ellipse at 90% 95%,#e04b70 0,transparent 34%),#09090d;color:#fff;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:22px}.panel{width:min(100%,420px);padding:30px 25px;border:1px solid #ffffff25;border-radius:28px;background:#17171dcc;box-shadow:0 25px 80px #0008;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}.logo{width:54px;height:54px;border-radius:17px;padding:3px;background:linear-gradient(135deg,#ffd776,#fa477e,#8c39c9);display:grid;place-items:center}.lens{width:100%;height:100%;border:3px solid white;border-radius:14px;position:relative}.lens:before{content:"";position:absolute;width:17px;height:17px;border:3px solid white;border-radius:50%;inset:0;margin:auto}.lens:after{content:"";position:absolute;width:5px;height:5px;background:white;border-radius:50%;top:7px;right:7px}h1{font-size:28px;margin:0;letter-spacing:-1px}p{color:#b8b8c3;text-align:center;font-size:13px;margin:10px 0 24px}.tabs{display:flex;background:#292932;border-radius:12px;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:0;border-radius:9px;padding:11px;background:none;color:#aaa;font-weight:700}.tabs button.active{background:linear-gradient(100deg,#8538c8,#e83e78);color:white}label{display:block;font-size:12px;color:#c9c9d1;margin:12px 2px 6px}input{width:100%;height:48px;border-radius:12px;border:1px solid #393944;background:#101015;color:white;padding:0 14px;outline:none}input:focus{border-color:#c04bba}button.submit{width:100%;height:49px;border:0;border-radius:13px;margin-top:20px;color:white;font-weight:800;background:linear-gradient(100deg,#833ab4,#c13584,#f77737)}#msg{min-height:22px;color:#ff9ba9;font-size:12px;text-align:center;margin-top:12px}.hint{text-align:center;color:#777;font-size:11px;margin-top:15px}
</style></head><body><main class="panel"><div class="brand"><div class="logo"><div class="lens"></div></div><h1>Insta Mode</h1></div><p>فضای مستقل برای عکس‌ها، ویدیوها و لحظه‌های تو</p><div class="tabs"><button id="loginTab" class="active" type="button">ورود</button><button id="registerTab" type="button">ساخت حساب</button></div><form id="authForm"><div id="nameField" hidden><label>نام نمایشی</label><input name="display_name" maxlength="60" placeholder="نامی که دیگران می‌بینند"></div><label id="loginLabel">نام کاربری، ایمیل یا شماره تلفن</label><input name="login" id="login" autocomplete="username" required placeholder="username یا ایمیل / شماره"><div id="identityFields" hidden><label>نام کاربری</label><input name="username" id="username" autocomplete="username" placeholder="username"><label>ایمیل (اختیاری)</label><input name="email" type="email" autocomplete="email" placeholder="name@example.com"><label>شماره تلفن (اختیاری)</label><input name="phone" type="tel" autocomplete="tel" placeholder="شماره تلفن"></div><label>رمز عبور</label><input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="حداقل ۸ کاراکتر"><button class="submit" id="submit" type="submit">ورود به اینستا</button><div id="msg" role="status"></div></form><div class="hint">حساب اینستا جدا از حساب چت‌روم است.</div></main>
<script>
(()=>{const $=id=>document.getElementById(id),form=$('authForm');let mode='login';function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('loginLabel').hidden=m==='register';$('login').hidden=m==='register';$('login').required=m==='login';$('identityFields').hidden=m!=='register';$('nameField').hidden=m!=='register';$('username').required=m==='register';$('submit').textContent=m==='login'?'ورود به اینستا':'ساخت حساب اینستا';$('msg').textContent=''}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');form.onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='';let f=new FormData(form),data={};f.forEach((v,k)=>{if(v)data[k]=v});try{let r=await fetch('/api/insta/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'خطا در ورود');location.href='/insta'}catch(err){$('msg').textContent=err.message}finally{$('submit').disabled=false}}})();
</script></body></html>
