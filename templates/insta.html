<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Insta Mode</title><link rel="stylesheet" href="{{ url_for('static', filename='insta.css') }}"></head><body class="ig-body"><div class="ig-root" id="ig-root" data-theme="auto"><header class="ig-top"><button type="button" id="ig-back-chat" aria-label="بازگشت" onclick="location.href='/chat'">×</button><h1 id="ig-brand"><span class="ig-brand-mark">◎</span> Insta Mode</h1><button type="button" id="ig-create-shortcut" aria-label="ساخت محتوا">＋</button></header><main class="ig-main" id="ig-main"></main><nav class="ig-nav" id="ig-nav" aria-label="ناوبری اینستا"><button data-tab="home" class="on" aria-label="خانه"></button><button data-tab="explore" aria-label="جستجو"></button><button data-tab="reels" aria-label="ریلز"></button><button data-tab="inbox" aria-label="پیام‌ها"></button><button data-tab="me" aria-label="پروفایل"></button></nav><div id="ig-layer"></div><div id="ig-toast" role="status" aria-live="polite"></div></div><script>window.IG={me:{{ current_user|tojson }},params:{post:new URLSearchParams(location.search).get('post'),u:new URLSearchParams(location.search).get('u'),dm:new URLSearchParams(location.search).get('dm')}};</script><script src="{{ url_for('static', filename='insta.js') }}" defer></script><script>document.addEventListener('click',e=>{if(e.target.closest('#ig-create-shortcut')){const b=document.querySelector('[data-create]');if(b)b.click();}});</script></body></html>
