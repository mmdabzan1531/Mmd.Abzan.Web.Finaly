<!doctype html>
<html lang="fa" dir="rtl"><head><title>Insta Mode | Chatroom</title>{% include "_head.html" %}<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="{{ url_for('static', filename='insta.css') }}?v={{ ASSET_V }}"></head>
<body class="ig-body">
<div class="ig-root" id="ig-root">
  <div class="ig-main" id="ig-main"></div>
  <nav class="ig-nav" id="ig-nav" aria-label="Insta Mode">
    <button type="button" data-tab="home" aria-label="خانه"></button>
    <button type="button" data-tab="reels" aria-label="ریلز"></button>
    <button type="button" data-tab="inbox" aria-label="پیام‌ها"></button>
    <button type="button" data-tab="explore" aria-label="جستجو"></button>
    <button type="button" data-tab="me" aria-label="پروفایل"></button>
  </nav>
  <div id="ig-layer"></div>
  <div class="ig-toast" id="ig-toast" role="status"></div>
</div>
<script>
window.IG = {
  me: {{ current_user|tojson }},
  params: {{ {"post": request.args.get("post", ""), "u": request.args.get("u", ""), "dm": request.args.get("dm", "")}|tojson }}
};
</script>
<script src="{{ url_for('static', filename='insta.js') }}?v={{ ASSET_V }}"></script>
</body></html>
