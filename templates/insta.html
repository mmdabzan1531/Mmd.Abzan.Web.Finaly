<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Insta Mode</title><link rel="stylesheet" href="{{ url_for('static', filename='insta.css') }}?v={{ ASSET_V }}"><link rel="stylesheet" href="{{ url_for('static', filename='insta-motion.css') }}?v={{ ASSET_V }}"><style>#ig-back-chat{text-decoration:none;color:inherit;display:inline-grid;place-items:center;min-width:44px;min-height:44px;cursor:pointer}.ig-nav button{min-height:44px}.ig-top button:focus-visible,.ig-top a:focus-visible,.ig-nav button:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style></head><body class="ig-body"><div class="ig-root" id="ig-root" data-theme="auto"><header class="ig-top"><a id="ig-back-chat" href="/" role="button" aria-label="بازگشت به صفحه انتخاب">×</a><h1 id="ig-brand"><span class="ig-brand-mark" aria-hidden="true">◎</span> Insta Mode</h1><button type="button" id="ig-create-shortcut" aria-label="ساخت محتوا">＋</button></header><main class="ig-main" id="ig-main" tabindex="-1"></main><nav class="ig-nav" id="ig-nav" aria-label="ناوبری اینستا"><button type="button" data-tab="home" class="on" aria-label="خانه" aria-current="page"></button><button type="button" data-tab="explore" aria-label="جستجو"></button><button type="button" data-tab="reels" aria-label="ریلز"></button><button type="button" data-tab="inbox" aria-label="پیام‌ها"></button><button type="button" data-tab="me" aria-label="پروفایل"></button></nav><div id="ig-layer" aria-live="polite"></div><div id="ig-toast" role="status" aria-live="polite"></div></div><script>window.IG={me:{{ current_user|tojson }},params:(function(q){return{post:q.get('post'),u:q.get('u'),dm:q.get('dm')}})(new URLSearchParams(location.search))};</script><script src="{{ url_for('static', filename='insta.js') }}?v={{ ASSET_V }}" defer></script><script>
document.addEventListener('click',e=>{if(e.target.closest('#ig-create-shortcut')){const b=document.querySelector('[data-create]');if(b)b.click();}});
(function(){var nav=document.getElementById('ig-nav');if(!nav||!window.MutationObserver)return;
function sync(){nav.querySelectorAll('button[data-tab]').forEach(function(b){if(b.classList.contains('on'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
new MutationObserver(sync).observe(nav,{subtree:true,attributes:true,attributeFilter:['class']});sync()})();
</script></body></html>
